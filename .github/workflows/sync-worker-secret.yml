name: Copiar DISPATCH_TOKEN para o Worker
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Gravar GITHUB_DISPATCH_TOKEN no Worker site-uniao-farma
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          test -n "$DISPATCH_TOKEN" || { echo "DISPATCH_TOKEN vazio"; exit 1; }
          printf '%s' "$DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GITHUB_DISPATCH_TOKEN --name site-uniao-farma
