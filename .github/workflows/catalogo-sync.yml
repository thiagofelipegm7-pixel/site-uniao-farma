name: Sincronizar catálogo da loja

# O PC da loja manda heartbeat/delta ao Worker a cada ~10 min. Este workflow acompanha o ritmo:
# baixa o catálogo, refaz o pipeline (ops/catalogo-nacoes) e, se o conteúdo mudou, faz commit na main
# (Workers Builds publica em seguida). Sem mudança: sai rápido (mudou=false), sem build.
# Dados recusados ou Worker fora do ar: nada é commitado e o site segue com o JSON anterior (fallback).
on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 min (a maioria das execuções não publica nada)
  workflow_dispatch:
    inputs:
      forcar:
        description: "Ignorar só os limites de queda de itens e de variação de preços (reajuste grande e consciente)"
        type: boolean
        default: false

concurrency:
  group: catalogo-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sincronizar:
    name: Baixar, conferir e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAFF_PASSWORD: ci-test-only-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Baixar o último envio do PC e refazer o catálogo
        id: sync
        env:
          CATALOGO_READ_TOKEN: ${{ secrets.CATALOGO_READ_TOKEN }}
          FORCAR: ${{ inputs.forcar && '--forcar' || '' }}
        run: python3 ops/catalogo-nacoes/sincronizar.py $FORCAR

      - name: Fotos enviadas pelo painel (/interno/fotos)
        id: fotos
        env:
          CATALOGO_READ_TOKEN: ${{ secrets.CATALOGO_READ_TOKEN }}
        run: python3 ops/catalogo-nacoes/baixar_fotos.py baixar

      - name: Instalar dependências
        if: steps.sync.outputs.mudou == 'true' || steps.fotos.outputs.fotos == 'true'
        run: npm ci

      - name: Refazer os arquivos da busca com as fotos novas
        if: steps.fotos.outputs.fotos == 'true'
        run: node scripts/gerar-assets-catalogo.mjs

      - name: Podar textos e pares de IA que deixaram de valer
        if: steps.sync.outputs.mudou == 'true'
        run: node --experimental-strip-types --import ./tests/ts-resolve-hook.mjs scripts/podar-dados-ia.mjs

      - name: Testes unitários
        if: steps.sync.outputs.mudou == 'true' || steps.fotos.outputs.fotos == 'true'
        run: npm test

      - name: Build
        if: steps.sync.outputs.mudou == 'true' || steps.fotos.outputs.fotos == 'true'
        run: npm run build

      - name: Testes de HTML renderizado
        if: steps.sync.outputs.mudou == 'true' || steps.fotos.outputs.fotos == 'true'
        run: node --test tests/rendered-html.test.mjs

      - name: Commit na main
        id: commit
        if: steps.sync.outputs.mudou == 'true' || steps.fotos.outputs.fotos == 'true'
        env:
          DADOS_DE: ${{ steps.sync.outputs.dados_de }}
          FOTOS: ${{ steps.fotos.outputs.eans }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/nacoes-unidas/produtos/dados/catalogo-nacoes.json app/nacoes-unidas/produtos/dados/receita-nacoes.json app/nacoes-unidas/produtos/dados/descricoes-ia.json app/nacoes-unidas/produtos/dados/relacionados-ia.json app/nacoes-unidas/produtos/dados/revisao-pendente.json public/dados/nacoes public/produtos app/nacoes-unidas/produtos/imagens.ts
          git diff --cached --quiet && exit 0
          if [ -n "$FOTOS" ] && [ -z "$DADOS_DE" ]; then MSG="Fotos de produtos enviadas pelo painel (${FOTOS})"; else MSG="Catálogo: dados da loja de ${DADOS_DE} (sincronização automática)"; fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Apagar do painel as fotos já publicadas
        if: steps.fotos.outputs.fotos == 'true'
        env:
          CATALOGO_READ_TOKEN: ${{ secrets.CATALOGO_READ_TOKEN }}
          EANS: ${{ steps.fotos.outputs.eans }}
        run: python3 ops/catalogo-nacoes/baixar_fotos.py apagar $EANS

      - name: Anotar a falha para o painel
        if: failure()
        run: echo "::error title=Sincronização falhou::Os dados novos foram baixados, mas algum passo (testes, build ou publicação) falhou. O site segue com os dados anteriores. Abra esta execução para ver qual passo."
