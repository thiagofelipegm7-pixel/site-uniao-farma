name: Sincronizar catálogo da loja

# O PC da loja manda heartbeat/delta ao Worker a cada ~10 min. Este workflow acompanha o ritmo:
# baixa o catálogo, refaz o pipeline (ops/catalogo-nacoes) e, se o conteúdo mudou, faz commit na main
# (a publicação do Worker de dados fica a cargo do publisher já ligado à main; o Deploy Cloudflare
# ignora só arquivos de catálogo/fotos para não republicar o Worker duas vezes).
# Mudança só de catálogo: espera 30 min desde o último commit desses dados (o estoque ao vivo
# em /api/estoque já atualiza o site). Foto ou coleção nova, ou disparo manual, entra na hora.
# Sem mudança: sai rápido (mudou=false), sem build.
# Dados recusados ou Worker fora do ar: nada é commitado e o site segue com o JSON anterior (fallback).
on:
  schedule:
    - cron: "*/10 * * * *" # a cada 10 min (a maioria das execuções não publica nada)
  workflow_dispatch:
    inputs:
      forcar:
        description: "Ignorar só os limites de queda de itens e de variação de preços (reajuste grande e consciente)"
        type: boolean
        default: false

concurrency:
  group: catalogo-sync
  # Um tique novo cancela a execução anterior ainda em teste/build, para não empilhar publicações.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sincronizar:
    name: Baixar, conferir e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAFF_PASSWORD: ci-test-only-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Baixar o último envio do PC e refazer o catálogo
        id: sync
        env:
          CATALOGO_READ_TOKEN: ${{ secrets.CATALOGO_READ_TOKEN }}
          FORCAR: ${{ inputs.forcar && '--forcar' || '' }}
        run: python3 ops/catalogo-nacoes/sincronizar.py $FORCAR

      - name: Fotos enviadas pelo painel (/interno/fotos)
        id: fotos
        env:
          CATALOGO_READ_TOKEN: ${{ secrets.CATALOGO_READ_TOKEN }}
        run: python3 ops/catalogo-nacoes/baixar_fotos.py baixar

      - name: Coleções de fotos extras (/interno/colecoes)
        id: colecoes
        env:
          CATALOGO_READ_TOKEN: ${{ secrets.CATALOGO_READ_TOKEN }}
        run: python3 ops/catalogo-nacoes/baixar_colecoes.py sincronizar

      - name: Adiar catálogo recente (fotos e coleções entram na hora)
        id: janela
        run: |
          MUDOU="${{ steps.sync.outputs.mudou }}"
          FOTOS="${{ steps.fotos.outputs.fotos }}"
          COLECOES="${{ steps.colecoes.outputs.colecoes }}"
          EVENTO="${{ github.event_name }}"
          if [ "$FOTOS" = "true" ] || [ "$COLECOES" = "true" ] || [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MUDOU" != "true" ]; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git log -1 --format=%ct -- app/nacoes-unidas/produtos/dados/catalogo-nacoes.json || echo 0)
          now=$(date +%s)
          if [ "$last" != "0" ] && [ $((now - last)) -lt 1800 ]; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "Último catálogo no git há $((now - last))s; espera 30 min. O estoque ao vivo já atualiza o site."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências
        if: steps.janela.outputs.publicar == 'true'
        run: npm ci

      - name: Refazer os arquivos da busca com as fotos novas
        if: steps.fotos.outputs.fotos == 'true'
        run: node scripts/gerar-assets-catalogo.mjs

      - name: Podar textos e pares de IA que deixaram de valer
        if: steps.sync.outputs.mudou == 'true'
        run: node --experimental-strip-types --import ./tests/ts-resolve-hook.mjs scripts/podar-dados-ia.mjs

      - name: Testes unitários
        if: steps.janela.outputs.publicar == 'true'
        run: npm test

      - name: Build
        if: steps.janela.outputs.publicar == 'true'
        run: npm run build

      - name: Testes de HTML renderizado
        if: steps.janela.outputs.publicar == 'true'
        run: node --test tests/rendered-html.test.mjs

      - name: Commit na main
        id: commit
        if: steps.janela.outputs.publicar == 'true'
        env:
          DADOS_DE: ${{ steps.sync.outputs.dados_de }}
          FOTOS: ${{ steps.fotos.outputs.eans }}
          COLECOES: ${{ steps.colecoes.outputs.colecoes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/nacoes-unidas/produtos/dados/catalogo-nacoes.json app/nacoes-unidas/produtos/dados/datas-produtos.json app/nacoes-unidas/produtos/dados/receita-nacoes.json app/nacoes-unidas/produtos/dados/descricoes-ia.json app/nacoes-unidas/produtos/dados/relacionados-ia.json app/nacoes-unidas/produtos/dados/revisao-pendente.json app/nacoes-unidas/produtos/dados/nomes-corrigidos.json app/nacoes-unidas/produtos/dados/controlados-overrides.json app/nacoes-unidas/produtos/dados/categorias-overrides.json app/nacoes-unidas/produtos/dados/marcas-corrigidas.json app/nacoes-unidas/produtos/dados/mudancas-recentes.json app/nacoes-unidas/produtos/dados/descricoes-painel.json app/nacoes-unidas/produtos/dados/palavras-busca.json app/nacoes-unidas/produtos/dados/produtos-removidos.json public/dados/nacoes public/produtos public/produtos-extras app/nacoes-unidas/produtos/dados/fotos-extras.json app/nacoes-unidas/produtos/imagens.ts
          git diff --cached --quiet && exit 0
          if [ -n "$FOTOS" ] && [ -z "$DADOS_DE" ]; then MSG="Fotos de produtos enviadas pelo painel (${FOTOS})"; elif [ "$COLECOES" = "true" ] && [ -z "$DADOS_DE" ] && [ -z "$FOTOS" ]; then MSG="Coleções de fotos atualizadas pelo painel"; else MSG="Catálogo: dados da loja de ${DADOS_DE} (sincronização automática)"; fi
          git commit -m "$MSG"
          git pull --no-rebase origin main
          git push origin HEAD:main

      - name: Apagar do painel as fotos já publicadas
        if: steps.fotos.outputs.fotos == 'true'
        env:
          CATALOGO_READ_TOKEN: ${{ secrets.CATALOGO_READ_TOKEN }}
          EANS: ${{ steps.fotos.outputs.eans }}
        run: python3 ops/catalogo-nacoes/baixar_fotos.py apagar $EANS

      - name: Anotar a falha para o painel
        if: failure()
        run: echo "::error title=Sincronização falhou::Os dados novos foram baixados, mas algum passo (testes, build ou publicação) falhou. O site segue com os dados anteriores. Abra esta execução para ver qual passo."
