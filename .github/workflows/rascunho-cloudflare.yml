name: Rascunho Cloudflare

# Envia a versão do branch "rascunho" para um endereço de visualização (preview) do Worker.
# Não troca o site ao vivo: a produção só muda quando o "rascunho" entra no main.

on:
  push:
    branches: [rascunho]
  workflow_dispatch:

concurrency:
  group: rascunho-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Build e visualização
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAFF_PASSWORD: ci-test-only-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build Vinext / Cloudflare
        run: npm run build

      - name: Testes de HTML renderizado
        run: node --test tests/rendered-html.test.mjs

      - name: Enviar visualização do rascunho
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 versions upload --config dist/server/wrangler.json --name site-uniao-farma --preview-alias rascunho --message "Rascunho ${GITHUB_SHA::7}" | tee envio.log
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' envio.log | head -1)
          {
            echo "## Visualização do rascunho"
            echo ""
            echo "Endereço: ${URL:-não encontrado no log (veja o passo Enviar visualização)}"
          } >> "$GITHUB_STEP_SUMMARY"
